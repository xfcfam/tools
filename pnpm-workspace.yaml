allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@xfcfam/xf@0.2.0'

# Security overrides — force patched versions of vulnerable transitive
# deps (mirrors xfcfam/lib-npm). Apply only to this workspace, not to
# consumers of the published package.
overrides:
  vite: '>=6.4.2'
  esbuild: '>=0.24.3'
  # lodash / lodash-es: pull patched 4.18.x (via java-parser → chevrotain).
  # Fixes CVE-2025-13465 (_.unset/_.omit prototype pollution) and
  # CVE-2026-4800 (_.template code injection); both patched in 4.18.0.
  lodash: '>=4.18.0'
  lodash-es: '>=4.18.0'
