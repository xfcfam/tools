name: release

# Solo, token-free publish — no PR flow (this repo is maintained by one
# person and is not collaborative).
#
# The maintainer versions locally and pushes to `main`:
#   pnpm changeset            # (optional) describe the change for the CHANGELOG
#   pnpm changeset version    # bump package.json + CHANGELOG
#   git commit -am "release" && git push
#
# On that push, this workflow builds and runs `changeset publish`, which
# publishes the package only when its local version is ahead of npm.
#
# npm auth is **trusted publishing (OIDC)** — NO npm token. The job's
# `id-token: write` + the package's Trusted Publisher config (org `xfcfam`,
# repo `tools`, workflow `release.yml`, environment `release`) let npm verify
# this run. Provenance attestations are generated automatically.
#
# Required configuration:
#   - A GitHub Environment `release`, restricted to `main`.
#   - The package's Trusted Publisher on npmjs.com (environment `release`).
#   - (First publish only) bootstrap @xfcfam/tools manually once, since a
#     brand-new package name cannot be created by an OIDC publish.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Pre-publish dogfood: refuse to publish if tools is not well-formed
      # (Λ < 3) against its OWN source. Runs before the publish step so a
      # regression aborts the release instead of shipping to npm.
      - name: XF conformance gate (Λ ≥ 3 — self-validate)
        run: pnpm validate .

      - name: Upgrade npm for OIDC
        # Runners ship npm 10.x; trusted publishing needs npm >= 11.5.1.
        # `pnpm changeset publish` calls npm under the hood, so upgrade it.
        run: npm install -g npm@latest

      - name: Publish
        # `pnpm release` = build + changeset publish. Publishes only when the
        # local version is ahead of npm; otherwise it is a no-op.
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: "true"
