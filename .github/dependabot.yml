# Dependabot configuration for the xfcfam/tools repo.
#
# Single-package repo, so only the root needs an npm entry. Mirrors
# xfcfam/lib-npm: grouped updates to keep PR noise low —
#   - one PR for all minor + patch bumps (safe, merge once CI is green)
#   - one PR for all major bumps (review together; may break)
#   - one PR for GitHub Actions bumps

version: 2
updates:
  # ── npm: workspace root ──────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"

  # ── GitHub Actions ───────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        update-types:
          - "major"
          - "minor"
          - "patch"
